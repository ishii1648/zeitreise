<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- #284: viewport-fit=cover で env(safe-area-inset-*) を有効にする。
         下端バー化したタイムラインを Safe Area 直上に置くため（app.css の
         小画面ブレークポイント）。inset の無い端末では従来と同一表示 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>ヨーロッパ国境変遷マップ</title>
    <!-- #300: favicon（羊皮紙調の羅針盤モチーフ）。SVG 対応ブラウザは後勝ちで
         favicon.svg を、非対応ブラウザや /favicon.ico を直接リクエストする
         クライアントは ico を使う。両ファイルは scripts/build.ts
         getStaticCopyTargets で dist/ へコピーされる -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="vendor/maplibre-gl.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="map"></div>
    <!-- TASK-9: GeoJSON ロード中スピナー（app-spec §5.4）。表示制御は main.ts -->
    <div
      id="loading-spinner"
      class="loading-spinner"
      role="status"
      aria-label="地図データを読み込み中"
      hidden
    >
    </div>
    <!-- TASK-9: fetch 失敗時のエラートースト + 再試行（app-spec §5.4）。文言・表示は main.ts -->
    <div id="error-toast" class="error-toast" role="alert" hidden>
      <span id="error-toast-message" class="error-toast-message"></span>
      <button
        id="error-toast-retry"
        class="error-toast-retry"
        type="button"
      >
        再試行
      </button>
      <button
        id="error-toast-close"
        class="error-toast-close"
        type="button"
        aria-label="閉じる"
      >
        ×
      </button>
    </div>
    <!-- TASK-7: ホバーツールチップ（app-spec §5.2）。位置・内容・表示制御は main.ts -->
    <div id="info-tooltip" class="info-tooltip" role="tooltip" hidden></div>
    <!-- TASK-6/TASK-25: タイムラインスライダー（app-spec §5.1）。目盛り・値・年表示は main.ts が初期化する。
         デスクトップは画面左端の縦レイアウト（上=古い 1000 / 下=新しい 1914。
         range の縦向き化は app.css の writing-mode）。小画面（#284）は Safe Area
         直上の最下部 1 段バー（左=古い / 右=新しい） -->
    <div
      id="timeline"
      class="timeline"
      role="group"
      aria-label="年代スライダー"
    >
      <span id="timeline-year" class="timeline-year" aria-live="polite"
      >1000</span>
      <div class="timeline-controls">
        <button
          id="timeline-prev"
          class="timeline-btn"
          type="button"
          aria-label="前の年代"
        >
          ▲
        </button>
        <input
          id="timeline-slider"
          class="timeline-slider"
          type="range"
          min="0"
          max="0"
          step="1"
          value="0"
          list="timeline-marks"
          aria-label="年代"
        />
        <button
          id="timeline-next"
          class="timeline-btn"
          type="button"
          aria-label="次の年代"
        >
          ▼
        </button>
      </div>
      <datalist id="timeline-marks"></datalist>
    </div>
    <!-- #328: データ出典・ライセンスは MapLibre 標準の AttributionControl
         （右下のコンパクトな「ⓘ」）へ統合した。左上に置いていた独自のⓘ
         （出典・免責）と⚠（既知の制限）は DOM ごと撤去し、常設 UI は
         タイムスライダーとこの「ⓘ」1 個だけになる。表示内容の組み立ては
         src/map_attribution.ts、コントロールの生成・初期折りたたみは
         src/main.ts が行う -->
    <script type="module" src="app.js"></script>
  </body>
</html>
