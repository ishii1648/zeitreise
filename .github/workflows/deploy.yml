# TASK-127: Cloudflare Pages + R2 への本番デプロイ。
#
# 構成（docs/app-spec.md §3.1 / §6）:
# - build ジョブ: テスト + `deno task build` で dist/ を生成し artifact 化する。
#   本番シークレットは一切渡さない（AC #4）。
# - deploy ジョブ: CLOUDFLARE_API_TOKEN はこのジョブの env にのみ現れる。
#   1. R2 バケット zeitreise-tiles へ PMTiles を同期（未配置または
#      workflow_dispatch の refresh_tiles 指定時のみ生成し、sha256 サイドカー
#      比較で変更が無ければアップロードをスキップする。サイズが大きいため）
#   2. `wrangler pages deploy` で dist/ を Pages プロジェクト zeitreise へ配信
#   3. デプロイで削除されたファイルのエッジキャッシュを URL 単位パージ
#      （前回デプロイの dist マニフェストを R2 に保存して差分検出。#298 /
#      app-spec §3.4。ロジックは scripts/purge_deleted_paths.ts）
#
# R2 へのアップロードは S3 互換 API（aws CLI）で行う。europe-dem.pmtiles
# （約 305 MiB）が `wrangler r2 object put` の 300 MiB 上限を超えるため、
# マルチパート対応の S3 API を使う。S3 資格情報は登録済みの API トークンから
# 導出する（Access Key ID = トークン ID、Secret = トークン値の SHA-256。
# https://developers.cloudflare.com/r2/api/tokens/）。
#
# PMTiles はエッジ長期キャッシュ（#245 / docs/app-spec.md §3.4）:
# - オブジェクトに Cache-Control: public, max-age=31536000, immutable を付与
#   （アップロードをスキップした既存オブジェクトへは CopyObject
#   --metadata-directive REPLACE で冪等に反映する）
# - 差し替え（refresh_tiles）でオブジェクトを更新した場合は Cloudflare の
#   URL 単位パージを実行する（トークンにゾーン zeitreises.com の
#   Zone.Zone:Read + Zone.Cache Purge:Purge 権限が必要。app-spec §3.4）
# - エッジに実際に載せるには .pmtiles を cache-eligible にする Cache Rule が
#   別途必要（一度きりの手動設定。app-spec §3.4）

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refresh_tiles:
        description: "PMTiles を再生成し、変更があれば R2 へ再アップロードする"
        type: boolean
        default: false

permissions:
  contents: read

# 本番デプロイは直列化する（追い越し・巻き戻りを防ぐためキャンセルもしない）
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # ci.yml と同じ理由で開発環境と同一バージョンにピン留め（決定性の確保）
          deno-version: "2.7.14"

      # デプロイ前の最終ゲート（ci.yml と同一のテスト権限）
      - name: deno task test
        run: deno task test

      - name: deno task build
        run: deno task build

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    # AC #4: 本番シークレットはこのジョブの env にのみ現れる
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Account ID は秘密情報ではない（docs/cloudflare-provisioning.md / TASK-127）
      CLOUDFLARE_ACCOUNT_ID: da40f700e2fa3c06e86e30e8c29150bf
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.7.14"

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Sync PMTiles to R2 (zeitreise-tiles)
        env:
          REFRESH_TILES: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_tiles && 'true' || 'false' }}
        run: |
          set -euo pipefail
          TILES_BASE="https://tiles.zeitreises.com"
          BUCKET="zeitreise-tiles"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          ZONE_NAME="zeitreises.com"

          # PMTiles は不変に近い運用のため長期キャッシュで配信する
          # （#245 / app-spec §3.4）。差し替え時は末尾のパージで反映する。
          PMTILES_CACHE_CONTROL="public, max-age=31536000, immutable"
          # パージが必要になった URL を空白区切りで蓄積する
          PURGE_URLS=""

          # --- API トークンから R2 の S3 資格情報を導出する ---
          # Access Key ID: トークン ID（verify エンドポイントで取得。
          # ユーザートークン/アカウントトークンの両形式を順に試す）
          verify_id() {
            curl -sf -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$1" \
              | jq -r '.result.id // empty'
          }
          TOKEN_ID="$(verify_id "https://api.cloudflare.com/client/v4/user/tokens/verify" || true)"
          if [ -z "${TOKEN_ID}" ]; then
            TOKEN_ID="$(verify_id "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" || true)"
          fi
          if [ -z "${TOKEN_ID}" ]; then
            echo "::error::API トークンの verify に失敗しました。R2 用の S3 資格情報を導出できません（トークンに R2 権限があるか確認してください）"
            exit 1
          fi
          export AWS_ACCESS_KEY_ID="${TOKEN_ID}"
          AWS_SECRET_ACCESS_KEY="$(printf '%s' "${CLOUDFLARE_API_TOKEN}" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::${AWS_SECRET_ACCESS_KEY}"
          export AWS_SECRET_ACCESS_KEY
          export AWS_DEFAULT_REGION=auto
          # aws CLI v2.23+ の既定チェックサムは R2 と非互換になり得るため抑止する
          export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
          # 後続ステップ（削除ファイルのパージ #298）も同じ S3 資格情報で R2 を
          # 読み書きするため、job 環境へ引き継ぐ（同一 job 内。秘密値は上で
          # add-mask 済み）
          {
            echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
            echo "AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}"
            echo "AWS_REQUEST_CHECKSUM_CALCULATION=${AWS_REQUEST_CHECKSUM_CALCULATION}"
            echo "AWS_RESPONSE_CHECKSUM_VALIDATION=${AWS_RESPONSE_CHECKSUM_VALIDATION}"
          } >> "${GITHUB_ENV}"

          # --- バケット CORS（アプリのオリジンからの Range fetch を許可）---
          # 冪等なので毎デプロイで適用する。失敗時はタイルが本番で読めないため
          # 明示的に fail させる
          aws s3api put-bucket-cors --bucket "${BUCKET}" \
            --cors-configuration "file://.github/r2-cors.json" \
            --endpoint-url "${ENDPOINT}"

          # --- 生成の要否判定 ---
          # 既にカスタムドメインで配信済み（HEAD 200）かつ refresh 指定なしなら
          # 生成もアップロードも行わない（PMTiles は不変に近い運用。app-spec §3.4）
          need_object() {
            if [ "${REFRESH_TILES}" = "true" ]; then
              return 0
            fi
            if curl -sfI "${TILES_BASE}/$1" > /dev/null; then
              return 1
            fi
            return 0
          }
          NEED_BASEMAP=false
          NEED_DEM=false
          if need_object europe.pmtiles; then NEED_BASEMAP=true; fi
          if need_object europe-dem.pmtiles; then NEED_DEM=true; fi
          echo "basemap: need=${NEED_BASEMAP} / dem: need=${NEED_DEM} (refresh=${REFRESH_TILES})"

          # --- 生成 ---
          if [ "${NEED_BASEMAP}" = "true" ]; then
            # deno task extract-pmtiles が呼ぶ go-pmtiles CLI を導入する
            curl -sSfL -o /tmp/go-pmtiles.tar.gz \
              "https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/go-pmtiles_1.31.2_Linux_x86_64.tar.gz"
            mkdir -p /tmp/go-pmtiles
            tar -xzf /tmp/go-pmtiles.tar.gz -C /tmp/go-pmtiles
            sudo install /tmp/go-pmtiles/pmtiles /usr/local/bin/pmtiles
            deno task extract-pmtiles
          fi
          if [ "${NEED_DEM}" = "true" ]; then
            deno task extract-dem
          fi

          # --- 変更があった場合のみアップロード（sha256 サイドカー比較）---
          upload_if_changed() {
            name="$1"
            file="data/$1"
            local_sha="$(sha256sum "${file}" | cut -d' ' -f1)"
            remote_sha="$(curl -sf "${TILES_BASE}/${name}.sha256" || true)"
            if [ "${local_sha}" = "${remote_sha}" ]; then
              echo "${name}: 変更なし（sha256 一致）につきアップロードをスキップ"
              return 0
            fi
            aws s3 cp "${file}" "s3://${BUCKET}/${name}" \
              --endpoint-url "${ENDPOINT}" \
              --cache-control "${PMTILES_CACHE_CONTROL}" \
              --content-type application/octet-stream
            # sha256 サイドカーは差分検出（このステップ自身が読む）の正しさの
            # ため no-cache のまま長期キャッシュしない
            printf '%s' "${local_sha}" > "/tmp/${name}.sha256"
            aws s3 cp "/tmp/${name}.sha256" "s3://${BUCKET}/${name}.sha256" \
              --endpoint-url "${ENDPOINT}" \
              --cache-control no-cache \
              --content-type text/plain
            echo "${name}: アップロード完了（sha256=${local_sha}）"
            PURGE_URLS="${PURGE_URLS} ${TILES_BASE}/${name}"
          }
          if [ "${NEED_BASEMAP}" = "true" ]; then upload_if_changed europe.pmtiles; fi
          if [ "${NEED_DEM}" = "true" ]; then upload_if_changed europe-dem.pmtiles; fi

          # --- 既存オブジェクトへの Cache-Control 反映（#245）---
          # sha256 一致や HEAD 200 でアップロードが走らないデプロイでも、
          # オブジェクトの Cache-Control が方針と異なれば同一バケット内
          # CopyObject（--metadata-directive REPLACE）でメタデータのみ
          # 書き換える（冪等。CopyObject の 5 GB 上限内であること）。
          ensure_cache_control() {
            name="$1"
            current="$(aws s3api head-object --bucket "${BUCKET}" --key "${name}" \
              --endpoint-url "${ENDPOINT}" \
              --query CacheControl --output text 2> /dev/null || echo "__absent__")"
            if [ "${current}" = "__absent__" ]; then
              echo "${name}: オブジェクト未配置につき Cache-Control 反映をスキップ"
              return 0
            fi
            if [ "${current}" = "${PMTILES_CACHE_CONTROL}" ]; then
              echo "${name}: Cache-Control は設定済み"
              return 0
            fi
            aws s3api copy-object --bucket "${BUCKET}" --key "${name}" \
              --copy-source "${BUCKET}/${name}" \
              --endpoint-url "${ENDPOINT}" \
              --metadata-directive REPLACE \
              --cache-control "${PMTILES_CACHE_CONTROL}" \
              --content-type application/octet-stream > /dev/null
            echo "${name}: Cache-Control を更新（${current} -> ${PMTILES_CACHE_CONTROL}）"
            PURGE_URLS="${PURGE_URLS} ${TILES_BASE}/${name}"
          }
          ensure_cache_control europe.pmtiles
          ensure_cache_control europe-dem.pmtiles

          # --- Cloudflare エッジキャッシュのパージ（#245）---
          # 長期キャッシュ化に伴い、オブジェクトを更新したら該当 URL を
          # パージしないと最長 1 年古いタイルが配信され続ける。API トークンには
          # ゾーン zeitreises.com の Zone.Zone:Read（ゾーン ID 解決用）と
          # Zone.Cache Purge:Purge が必要（app-spec §3.4）。
          purge_edge_cache() {
            zone_id="$(curl -sf -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}" \
              | jq -r '.result[0].id // empty' || true)"
            if [ -z "${zone_id}" ]; then
              echo "ゾーン ID を取得できません（トークンに Zone.Zone:Read 権限が無い可能性）"
              return 1
            fi
            # shellcheck disable=SC2086  # PURGE_URLS は空白区切りの URL リスト
            printf '%s\n' ${PURGE_URLS} | jq -R . | jq -sc '{files: .}' \
              > /tmp/purge.json
            result="$(curl -sf -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data @/tmp/purge.json \
              "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache")" || return 1
            [ "$(printf '%s' "${result}" | jq -r '.success')" = "true" ]
          }
          if [ -n "${PURGE_URLS}" ]; then
            if purge_edge_cache; then
              echo "エッジキャッシュをパージ:${PURGE_URLS}"
            elif [ "${REFRESH_TILES}" = "true" ]; then
              echo "::error::PMTiles を差し替えたが Cloudflare のパージに失敗しました。古いタイルが最長 1 年配信され続けるため失敗させます（必要なトークン権限は docs/app-spec.md §3.4 を参照）"
              exit 1
            else
              echo "::warning::Cloudflare のパージに失敗しました（初回アップロード/メタデータ更新のみのため続行。必要なトークン権限は docs/app-spec.md §3.4 を参照）"
            fi
          fi

      - name: Deploy dist to Cloudflare Pages (zeitreise)
        run: |
          npx --yes wrangler@4.114.0 pages deploy dist \
            --project-name=zeitreise \
            --branch=main \
            --commit-dirty=true

      # デプロイで削除・置換されたファイルのエッジキャッシュをパージする
      # （#298 / docs/app-spec.md §3.4）。dist のハッシュ付きアセットは
      # immutable 長期キャッシュ（#246 / #270）のため、削除しても旧コピーが
      # 素の URL で最長 1 年配信され続ける。前回デプロイの dist ファイル一覧
      # （マニフェスト）を R2 に保存しておき、今回の dist との差分 =
      # 削除された配信パスを検出して URL 単位パージする。差分検出とパージ
      # リクエスト生成は scripts/purge_deleted_paths.ts（テスト済みの純
      # ロジック）が担う。.github/purge-paths.txt に列挙したパスは差分に
      # 関係なく毎回パージする（この仕組みの導入前に削除されたファイルの
      # 残留解消用。冪等）。
      - name: Purge deleted files from edge cache
        run: |
          set -euo pipefail
          BUCKET="zeitreise-tiles"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          ZONE_NAME="zeitreises.com"
          MANIFEST_KEY="deploy/dist-manifest.txt"

          # --- 今回の dist マニフェスト（配信パス一覧）を生成 ---
          (cd dist && find . -type f | sed 's|^\./||' | LC_ALL=C sort) \
            > /tmp/dist-manifest.txt

          # --- 前回デプロイのマニフェストを取得（初回は存在しない）---
          # 存在確認は head-object で行い、「未保存」とそれ以外の失敗
          # （認証エラー等）を区別する。存在するのに取得できない場合は
          # 削除検出を欠いたままマニフェストを上書きしないよう fail させる
          if aws s3api head-object --bucket "${BUCKET}" --key "${MANIFEST_KEY}" \
            --endpoint-url "${ENDPOINT}" > /dev/null 2>&1; then
            aws s3 cp "s3://${BUCKET}/${MANIFEST_KEY}" /tmp/prev-manifest.txt \
              --endpoint-url "${ENDPOINT}"
          else
            : > /tmp/prev-manifest.txt
            echo "前回マニフェスト未保存（初回）。差分検出はスキップし、明示パージ分のみ処理する"
          fi

          # --- 削除パス検出 + パージリクエスト生成 ---
          # stdout: purge_cache のリクエストボディ（30 URL 上限で分割済み、
          # 1 行 1 リクエスト）/ stderr: 検出ログ
          deno run --allow-read=/tmp,.github \
            scripts/purge_deleted_paths.ts \
            --previous /tmp/prev-manifest.txt \
            --current /tmp/dist-manifest.txt \
            --extra .github/purge-paths.txt \
            --base "https://${ZONE_NAME}" > /tmp/purge-bodies.txt

          # --- URL 単位パージ実行 ---
          # PMTiles のパージ（上）と異なり失敗は常に error で fail させる:
          # ここに来る URL は「削除済みなのにエッジに残留し得る」ものだけで、
          # パージに失敗すると旧本文が最長 1 年配信され続けるため。
          # 必要なトークン権限（Zone.Zone:Read + Zone.Cache Purge:Purge）は
          # docs/app-spec.md §3.4 を参照
          if [ -s /tmp/purge-bodies.txt ]; then
            zone_id="$(curl -sf -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}" \
              | jq -r '.result[0].id // empty' || true)"
            if [ -z "${zone_id}" ]; then
              echo "::error::ゾーン ID を取得できません（トークンに Zone.Zone:Read 権限が無い可能性）。削除ファイルの旧コピーが最長 1 年配信され続けるため失敗させます"
              exit 1
            fi
            while IFS= read -r body; do
              result="$(curl -sf -X POST \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data "${body}" \
                "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache")" || result=""
              if [ "$(printf '%s' "${result}" | jq -r '.success' 2> /dev/null)" != "true" ]; then
                echo "::error::削除ファイルのパージに失敗しました（必要なトークン権限は docs/app-spec.md §3.4 を参照）: ${result}"
                exit 1
              fi
            done < /tmp/purge-bodies.txt
            echo "削除ファイルのエッジキャッシュをパージしました:"
            jq -r '.files[]' /tmp/purge-bodies.txt
          else
            echo "削除されたファイルなし。パージ不要"
          fi

          # --- 今回のマニフェストを保存（次回デプロイの比較用）---
          # パージ成功後にのみ保存する（途中失敗時は前回分が残り、次回の
          # デプロイで削除検出をやり直せる）。deploy workflow 自身しか読まない
          # ため no-cache
          aws s3 cp /tmp/dist-manifest.txt "s3://${BUCKET}/${MANIFEST_KEY}" \
            --endpoint-url "${ENDPOINT}" \
            --cache-control no-cache \
            --content-type text/plain
          echo "dist マニフェストを保存: s3://${BUCKET}/${MANIFEST_KEY}（$(wc -l < /tmp/dist-manifest.txt) 件）"
