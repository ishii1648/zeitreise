name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check deno.json existence
        id: check_deno_config
        run: |
          if [ -f "deno.json" ] || [ -f "deno.jsonc" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "deno.json not found yet (see TASK-1). Skipping Deno steps."
          fi

      - name: Setup Deno
        if: steps.check_deno_config.outputs.exists == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # fmt の正準形が deno バージョン間で異なり CI とローカルで衝突するため、
          # 開発環境と同一バージョンにピン留めして決定性を確保する（TASK-9 で発生、
          # vendor CSS・空 div の整形が 2.7.14 と最新版で互いに非互換だった）
          deno-version: "2.7.14"

      - name: deno fmt --check
        if: steps.check_deno_config.outputs.exists == 'true'
        run: deno fmt --check

      - name: deno lint
        if: steps.check_deno_config.outputs.exists == 'true'
        run: deno lint

      - name: deno test
        if: steps.check_deno_config.outputs.exists == 'true'
        # TASK-76: 河川連続性の回帰テストが data/rivers.geojson を読むため、
        # data ディレクトリの読み取りのみ許可する（ネットワークは不許可のまま）
        # TASK-108: label_collision_test.ts が @deck.gl/core を読み込み、その
        # debug モジュールが process.env.NODE_ENV を参照するため、この 1 変数
        # だけ env 読み取りを許可する（他の環境変数・ネットワークは不許可のまま）
        # TASK-138: setup-issue-labels_test.ts が area ラベルの同期検証で
        # docs/development-style.md を読むため、docs の読み取りも許可する
        # #284: no-notes-references_test.ts が「解説」機能の残存参照を
        # src / scripts / index.html / app.css の走査で検出するため、これらの
        # 読み取りも許可する（deno.json の test タスクと同一の許可に揃える）
        # #467: agent-loop-config_test.ts が production 安全契約を検証するため、
        # .agent-loop.yaml の読み取りだけを追加する（network permission は与えない）
        run: deno test --allow-read=data,docs,src,scripts,index.html,app.css,.agent-loop.yaml,.github/purge-paths.txt,.github/workflows --allow-env=NODE_ENV

      - name: loop_supervisor 振る舞いテスト
        # #374: supervisor の境界判定（claim タグの裏取り）を herdr / git の
        # スタブで検証する。deno test には --allow-run を与えていないため
        # Deno.Command でシェルを起動できず、bash のテストを独立ステップで回す
        run: bash scripts/loop_supervisor_test.sh

      - name: deno task build
        if: steps.check_deno_config.outputs.exists == 'true'
        run: deno task build
